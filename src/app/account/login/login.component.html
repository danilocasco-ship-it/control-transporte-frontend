<div class="auth-page-wrapper pt-5">
  <div class="global-position global" id="auth-particles">
    <div class="bg-overlay"></div>
    <div class="shape">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        version="1.1"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        viewBox="0 0 1440 120"
      >
        <path
          d="M 0,36 C 144,53.6 432,123.2 720,124 C 1008,124.8 1296,56.8 1440,40L1440 140L0 140z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="auth-page-content">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center mt-sm-5 mb-4 text-white-50">
            <div>
              <a routerLink="/" class="d-inline-block auth-logo">
                <img
                  src="assets/images/global.png"
                  alt="LogoSeficorp"
                  height="100"
                />
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          <div class="card mt-4">
            <div class="card-body p-4">
              <div class="text-center mt-2">
                <h5 class="text-primary">! Bienvenido !</h5>
                <p class="text-muted">Control de Transporte</p>
              </div>
              <div class="p-2 mt-4">
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="mb-3">
                    <label class="form-label" for="username">Usuario</label>
                    <input
                      type="text"
                      class="form-control"
                      id="username"
                      formControlName="username"
                      [ngClass]="{
                        'is-invalid': submitted && f['username'].errors
                      }"
                      placeholder="Ingrese usuario"
                    />
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="password-input"
                      >Contraseña</label
                    >
                    <div class="position-relative auth-pass-inputgroup mb-3">
                      <input
                        [type]="fieldTextType ? 'text' : 'password'"
                        class="form-control pe-5"
                        placeholder="Ingrese contraseña"
                        id="password-input"
                        formControlName="password"
                        [ngClass]="{
                          'is-invalid': submitted && f['password'].errors
                        }"
                      />
                      <button
                        class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted"
                        type="button"
                        id="password-addon"
                        (click)="toggleFieldTextType()"
                      >
                        <i
                          class="mdi align-middle"
                          [ngClass]="{
                            'mdi-eye-off-outline': !fieldTextType,
                            'mdi-eye-outline': fieldTextType
                          }"
                        ></i>
                      </button>
                    </div>
                  </div>

                  <div class="mt-4">
                    <button class="btn btn-success w-100" type="submit">
                      Iniciar Sesión
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center">
            <p class="mb-0 text-muted">&copy; {{ year }} CONTROL TRANSPORTE</p>
          </div>
        </div>
      </div>
    </div>
  </footer>
</div>
